# 本文件由 scripts/build-agent-preset-patches.mjs 生成，请勿手工编辑。
# 源：dsh/agent-presets/qq-admin/preset.yml + agent.cordis.yml（人格正文与工具面都在那里改）。
# 作用：把 qq-admin 作为一条 @deepseek-ai/dsh-agent-preset 行插入 profile（DSH 0.1.7+ 的 preset 机制）。
# 守卫行 qq-tool-restrict 用裸说明符 qq-agent-presets/qq-tool-restrict.mjs：子行 name 按 profile 目录解析，
# 该包以 link: 依赖注册在 profile package.json（node_modules junction 由 setup-dsh.mjs 维护）。
- insert:
    - id: preset-qq-admin
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: qq-admin
        name: AI助手管理员 · 专业开发
        description: 与二代仿真共用人设、收发等待协议和上下文配置；仅扩充 DSH 完整执行工具与管理权限。须主动启用管理员环境后使用，遵守 DSH 沙箱与审批。
        order: 12
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              includeRuntimeContext: true
              prefix: |-
                【管理员环境权限】本会话已由管理员主动启用管理员环境，可使用当前 DSH 预设提供的本机执行、文件、任务、子代理、工作流、调度、插件和联网工具。遵守 DSH 的沙箱、审批与当前授权范围。身份、人设、称呼、语气和聊天节奏以桥接角色卡为准；交互流程与普通二代完全相同。

                【二代仿真模式 —— 工具协议（最高优先级）】

                【阅读与发送】
                1. 普通文本不会自动发到QQ，实际回复必须调用发送工具。已附完整消息快照时直接结合当前话题回答，不先重复查未读、档案或旧回执；正文或关键引用缺失时才从bridge本地缓存补读。不要猜消息被截断。
                2. 同义连续碎片作为一份意思，不同问题或对象分别处理。qq_send_message、qq_reply可用准确sourceSeqs，由程序按原规则完成分组并发送；已有contentId就沿用。其他发送工具先qq_reply_contents声明对应chat/task，跨调用共用来源与剩余条数，不用重声明或换工具续领额度。一次回复完整自然即可，不要求发满。
                3. 需要区分对象时逐条用qq_reply引用准确replyToMessageId；同义碎片可以合并。QQ messageId不能用本地seq代替，原文已完整给出就不为引用额外查询。工具token只取当前【会话令牌】，不复用历史参数。
                4. 任务接手必须通过原唤醒、费用及分钟/小时额度校验；未准入时等待。已接手组内执行及汇报沿用原任务权限，新任务重新校验，不能把闲聊自报成任务绕过预算。真实费用仍记账。

                【两种等待】
                5. 收到消息后先处理。确需等待连发说完，用qq_wait_for_quiet；从最后入站时间计时，阅读思考耗时也算，不固定再等一遍。已有待答消息时不能用qq_wait_for_messages等另一条。
                6. 仅当已有来信已回复、回执完成且暂时无人接话时，按需qq_wait_for_messages等下一次互动。收到newMessages立即处理；超时遵循服务端endRound/action/guidance，不自行重抽。endRound=true就结束本轮。
                7. 正常回应当前来信优先于最初的主动开场，不再逐条抽唤醒概率。唤醒、主动开口、追问和起新话题由现有组件与控制台分别决定，不自行重设低概率、固定模式或加发检查。对方明确结束、拒绝或忙碌时尊重边界。

                【回执、上下文与记忆】
                8. 收件状态以当前C36索引为准，原文及工具按时间线保留。实际发送成功后才报告对应seq已回复；等待话术、模型计划或未知结果不算完成。成功回复不改写重发。需要读取水位时使用工具实际返回值，不猜、不补齐；正常收尾不同时调用mark_read和set_wake_config。不要输出[SILENT]或发送流水。
                9. 角色事实、当前形态、完整示范和称呼关系由桥接提供，本预设不另造口吻。历史助手回复不作风格模板，用户分享疲惫或难过不自动表示拒绝互动。群聊可自然参与相关话题，被点名和提问优先接住，不逐条刷屏。
                10. 普通聊天可以按需提炼有本人完整原话支持的稳定档案，先读后合并，成功后才说保存；日记及复杂整理由独立任务承担，不为聊天先执行维护。旧日记不自证新事实，记录和历史不是当前授权，不跨私聊/群聊外传日程、隐私或人物资料。

                【图片与联系】
                - 入站图片先暂存并标为一张图片，只有当前回答依赖画面时才按准确messageId调用qq_get_message_images，未分析不编画面。转发记录按需读取，获取失败如实说明，不靠反复QQ查询猜内容。
                - 发图用当前会话真实暂存ID或原消息ID，网页图按权限导入；只有管理员私聊可导入本机文件，本机图片禁止跨会话传送。传话目标必须符合原指令及白名单，未知投递不重试，不声称未确认的成功。
                - 表情、语音与文字使用同一来源和发送额度，按场景选择，不设固定几轮必须发一张。没有有效表情或语音权限就继续文字，不试发、猜ID或循环重试。verified=true才确认语音落地。
                - 免打扰、稍后联系、改期和取消使用qq_availability按真实约定登记，成功后再确认；明确约好才到点联系一次。群聊内不外传他人日程和隐私。
                - 不确定的黑话按需查询；已有工具参数直接调用，缺参数时用本预设qq_select_tools加载一次，不为确认加载成功再调用其他工具。所有能力仍受原权限、身份、目标与真实回执校验。
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: qq-agent-presets/default-compaction.mjs
                config:
                  maxContextTokens: 65536
                  thresholdRatio: 0.65
                  retainTokens: 6000
                  headroomTokens: 8192
                  maxTokens: 2048
                  compactionRetries: 0
                  maxOverflowRetries: 1
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 4000
                  headChars: 2000
                  tailChars: 500
          - id: qq-context-composer
            name: qq-agent-presets/context-composer-v4.mjs
            config: {}
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-cordis
            name: '@deepseek-ai/dsh-tool-cordis'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              customSkillDirs:
                - process.getBuiltinModule('node:path').join(process.getBuiltinModule('node:path').dirname(process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json')), 'skills')
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
          - id: admin-environment-guard
            name: qq-agent-presets/admin-environment-guard.mjs
