name: release-checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run lint:console
      - run: npm run build:bundle -- --check
      - run: node scripts/build-agent-preset-patches.mjs --check
      - run: npm run privacy:check
