<section id="section-token" data-page="access" class="card">
      <h2>控制台访问令牌</h2>
      <div class="meta">用于打开本控制台 / 调用管理 API 的令牌。可手动输入新令牌保存，或留空生成随机令牌。修改后当前页面会自动使用新令牌。</div>
      <input type="password" id="consoleTokenInput" placeholder="输入新令牌（至少 16 位），留空则生成随机" autocomplete="new-password">
      <div class="row" style="margin-top:8px">
        <button id="consoleTokenSave" class="small primary" data-save-action>保存本机控制台令牌</button>
        <button id="consoleTokenRandom" class="small">生成随机令牌</button>
        <span class="meta" id="consoleTokenMsg"></span>
      </div>
    </section>
