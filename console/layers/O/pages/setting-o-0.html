<section id="section-setting-o-0" data-page="setting-o-0" class="card span-all commercial-component" hidden>
<h2>质量与工具日志</h2>
<details open class="settings-group"><summary><span class="layer-tag" data-layer="O">O</span>工具调用日志（AI 调用了什么工具、参数、成功/失败）</summary><div class="settings-content">
      <div class="row">
        <button id="v2ToolLogLoad" class="small">加载工具日志</button>
        <button id="v2ToolLogClear" class="small danger">清空工具日志</button>
        <span class="meta" id="v2ToolLogMsg"></span>
      </div>
      <div id="v2ToolLogOutput" class="tool-log-table">（空）</div>
      <h3 style="margin-top:20px">质量与工具日志 · 反馈处理队列</h3>
      <section id="v2FeedbackQueueOverview" class="feedback-overview" aria-label="反馈队列运行状态">
        <div class="feedback-overview-head"><div><b>队列运行状态 / 处理摘要</b><p class="meta">进入控制台后自动读取各队列数量；也可手动刷新。</p></div></div>
        <div class="feedback-overview-metrics" id="v2FeedbackQueueMetrics"><span class="feedback-empty">正在读取队列状态…</span></div>
        <div class="feedback-summary-placeholder"><b>最近处理摘要</b><span>预留区域 · 后续显示最近一次修复、重试和转入困难问题的摘要。</span></div>
      </section>
      <div id="v2FeedbackQueueOutput" class="feedback-history">正在自动加载处理队列…</div>

      </div></details>
</section>
