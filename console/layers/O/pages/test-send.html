<section id="section-test-send" data-page="operations" class="card">
      <h2>测试发送</h2>
      <div class="row test-send-targets" data-session-picker-scope="explicit">
        <div class="setting-field">
          <label for="tsKind">会话类型</label>
          <span class="test-send-select-control">
            <select id="tsKind">
              <option value="group">群聊</option>
              <option value="private">私聊</option>
            </select>
          </span>
        </div>
        <div class="setting-field">
          <label for="tsId">目标会话</label>
          <span class="test-send-select-control">
            <select id="tsId" data-session-kind="tsKind" required disabled>
              <option value="">正在读取会话…</option>
            </select>
          </span>
        </div>
      </div>
      <div class="setting-field"><label for="tsMsg">消息内容</label><textarea id="tsMsg" placeholder="这是一条测试消息"></textarea><small class="parameter-example" data-example-for="tsMsg">例：写“测试消息”：只有点击发送并通过权限检查后才向选定目标投递。</small></div>
      <div class="row" style="margin-top:8px">
        <button id="tsSend" disabled>发送测试</button>
        <span class="meta" id="tsMsg2"></span>
      </div>
      <div class="meta">目标必须在白名单内，否则拒绝。</div>
    </section>
