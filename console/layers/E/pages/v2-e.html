<section id="section-v2-e" data-page="v2-e" class="card span-all">
  <h2>语音库</h2>
  <div class="meta">选择一段库内语音，先校验目标和限制，再按需试发。</div>
<details class="settings-group" open><summary>语音列表与试发</summary><div class="settings-content">
      <div class="meta" style="margin-bottom:8px">
        语音库目录：<code>qq-bridge/audio/</code>（改 <code>socialV2.voice.dir</code> 可换）。把音频文件丢进去即可被 AI 用 <code>qq_send_voice</code> 发出；
        本面板用于调试与试发 —— 试发走的是与 AI 通道相同的解析/校验/限流路径（<code>/api/voice/send</code>），只是由你在控制台触发。
      </div>
      <div class="row voice-action-row">
        <button id="voiceRefreshBtn" type="button" class="btn-secondary">刷新语音库</button>
        <div class="setting-field"><label for="voiceSendTarget">发送目标</label><input type="text" id="voiceSendTarget" placeholder="group:60001" style="width:190px"><small class="parameter-example" data-example-for="voiceSendTarget">例：填private:10001：测试语音只投向此会话；先保留“只校验不发送”验证格式。</small></div>
        <label><input type="checkbox" id="voiceSendDryRun" style="width:auto" checked> 只校验不发送</label>
        <button id="voiceSendBtn" type="button">试发选中语音</button>
        <span id="voiceMsg" class="meta"></span>
      </div>
      <div id="voiceList" class="meta" style="margin-top:8px">点「刷新语音库」加载…</div>
      <div class="meta" style="margin-top:6px">可用格式与时长、体积、频率上限由现有语音接口返回；列表中会标明不可发送的文件。</div>

      </div></details>
<div class="row" style="margin-top:10px"><button class="small v2-save primary" data-page="v2-e" style="font-weight:bold;padding:8px 16px" data-save-action>保存当前参数（写入 config.json）</button><span class="meta v2-save-msg"></span></div>
</section>
