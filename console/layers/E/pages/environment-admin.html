<section id="section-environment-admin" data-page="environment-admin" class="card span-all environment-page">
  <h2>管理员环境</h2>
  <p class="meta">管理员私聊的开发模式与预设。</p>
      <div class="comp-card env-card">
        <div class="env-card-heading"><h3>管理员助手</h3><span class="meta">开发开关与预设</span></div>
        <div class="env-card-body" id="envAdminControls">
          <p class="meta">封闭 Agent 与管理员私聊使用同一套预设。启用后，聊天及仿真模式中的管理员私聊也使用此环境。</p>
          <div class="env-admin-fields">
            <div class="env-admin-field">
              <span class="env-admin-label" id="envAdminModeLabel">用于聊天与仿真</span>
              <label class="env-admin-switch" for="v2AdminDevEnabled"><input type="checkbox" id="v2AdminDevEnabled" aria-labelledby="envAdminModeLabel" aria-describedby="envAdminEnabledExample"><span>启用</span></label>
              <small class="parameter-example" id="envAdminEnabledExample" data-example-for="v2AdminDevEnabled">例：开启后使用所选开发预设；关闭后回到当前聊天模式的预设。</small>
            </div>
            <div class="env-admin-field">
              <label for="v2AdminDevPreset">管理员预设</label>
              <select id="v2AdminDevPreset" aria-describedby="envAdminPresetExample"><option value="">跟随 DSH 默认</option></select>
              <small class="parameter-example" id="envAdminPresetExample" data-example-for="v2AdminDevPreset">可选“AI助手管理员 · 专业开发”，保留桥接人设并提供开发工具。控制管理员会话的基础指令与可用工具。跟随默认时使用 DSH 当前标记的默认预设；与一、二代运行模式独立。</small>
            </div>
          </div>
          <p class="meta env-admin-apply"><b>生效方式：</b>保存后，如果所用预设发生变化，管理员私聊会在下一条消息到来时重建会话并使用新预设。</p>
          <div class="env-admin-actions"><button class="small primary v2-save" type="button" data-save-action>保存管理员环境</button><span class="meta v2-save-msg" role="status"></span></div>
        </div>
      </div>
</section>
