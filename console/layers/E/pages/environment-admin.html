<section id="section-environment-admin" data-page="environment-admin" class="card span-all environment-page">
  <div id="envAdminControls">
    <label class="env-admin-switch" for="v2AdminDevEnabled"><input type="checkbox" id="v2AdminDevEnabled" aria-describedby="envAdminEnabledExample"><span>启用管理员环境</span></label>
    <p class="meta" id="envAdminEnabledExample">开启使用 <code>qq-admin</code>；关闭后，管理员私聊跟随当前聊天模式，并取消未完成的委派任务。</p>
    <div class="env-admin-apply">
      <b>与二代仿真同步</b>
      <p class="meta"><code>qq-admin</code> 由二代仿真（<code>qq-chat-v2</code>）派生，同步其对话协议、上下文与压缩配置，并增加本机工具、独立任务等管理能力。模型和思考强度可在预设总览中单独设置。</p>
    </div>
    <div class="env-admin-actions"><button class="small primary v2-save" type="button" data-save-action>保存</button><span class="meta v2-save-msg" role="status"></span></div>
  </div>
</section>
