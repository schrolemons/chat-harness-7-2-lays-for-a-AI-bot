<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>QQ 桥接控制台</title>


<link rel="stylesheet" href="/console/app.css?v={{BUILD}}">
<script src="/console/theme-init.js?v={{BUILD}}"></script>
</head>
<body>
  <div class="bg-decor" aria-hidden="true"></div>
  <a class="skip-link" href="#mainContent">跳到主要内容</a>
  <!-- include:shared/layout/sidebar.html -->
  <div class="workspace">
    <!-- include:shared/layout/header.html -->
    <main id="mainContent" tabindex="-1">
      <div class="page-heading"><div><div class="eyebrow">QQ BRIDGE / CONSOLE</div><h1 id="pageTitle">让每一次连接，都自然发生。</h1><p id="pageDescription">掌握桥接状态，轻松管理你的 QQ 智能伙伴。</p></div>
        <div class="search-wrap"><label class="sr-only" for="consoleSearch">搜索功能或参数</label><input id="consoleSearch" type="search" placeholder="搜索功能或参数…" autocomplete="off" aria-controls="searchResults" aria-expanded="false"><div id="searchResults" class="search-results" hidden></div></div>
      </div>
      <div id="connectionAlert" class="connection-alert" role="alert" hidden></div>
      <div id="overviewSummary" class="overview-summary span-all" data-page="overview">
        <div class="metric"><span>DSH 连接</span><strong id="metricDsh">连接中</strong><small id="metricDshHint">等待服务响应</small></div>
        <div class="metric"><span>SnowLuma 上游</span><strong id="metricSnowluma">读取中</strong><small id="metricSnowlumaHint">等待网关健康上报</small></div>
        <div class="metric"><span>当前运行模式</span><strong id="metricMode">—</strong><small id="metricRole">正在读取角色</small></div>
        <button class="metric metric-link" data-view="sessions"><span>已建立会话</span><strong id="metricSessions">—</strong><small>查看会话映射 <span aria-hidden="true">↗</span></small></button>
        <button class="metric metric-link" data-view="sessions" data-target="section-pending"><span>待处理请求</span><strong id="metricPending">—</strong><small>提问与工具审批 <span aria-hidden="true">↗</span></small></button>
      </div>
      <div class="grid">
        <!-- include:layers/O/pages/mode.html -->
        <!-- include:layers/O/pages/dsh.html -->
        <!-- include:layers/O/pages/silent.html -->
        <!-- include:layers/O/pages/activity.html -->
        <!-- include:layers/C/pages/persona.html -->
        <!-- include:layers/C/pages/terms.html -->
        <!-- include:layers/C/pages/slang.html -->
        <!-- include:layers/C/pages/alias.html -->
        <!-- include:layers/C/pages/setting-c-0.html -->
        <!-- include:layers/C/pages/setting-c-1.html -->
        <!-- include:layers/C/pages/setting-c-2.html -->
        <!-- include:layers/T/pages/reference.html -->
        <!-- include:layers/T/pages/v2-t.html -->
        <!-- include:layers/T/pages/games.html -->
        <!-- include:layers/T/pages/codex-peer.html -->
        <!-- include:layers/T/pages/injection-lab.html -->
        <!-- include:layers/E/pages/environments.html -->
        <!-- include:layers/E/pages/sessions.html -->
        <!-- include:layers/E/pages/pending.html -->
        <!-- include:layers/E/pages/v2-e.html -->
        <!-- include:layers/L/pages/social-v1.html -->
        <!-- include:layers/L/pages/setting-l-0.html -->
        <!-- include:layers/L/pages/setting-l-1.html -->
        <!-- include:layers/L/pages/setting-l-2.html -->
        <!-- include:layers/O/pages/usage.html -->
        <!-- include:layers/O/pages/setting-o-0.html -->
        <!-- include:layers/O/pages/setting-o-1.html -->
        <!-- include:layers/O/pages/setting-o-2.html -->
        <!-- include:layers/O/pages/notify.html -->
        <!-- include:layers/O/pages/test-send.html -->
        <!-- include:layers/O/pages/maintenance.html -->
        <!-- include:layers/V/pages/layer-v.html -->
        <!-- include:layers/V/pages/human.html -->
        <!-- include:layers/G/pages/whitelist.html -->
        <!-- include:layers/G/pages/security.html -->
        <!-- include:layers/G/pages/token.html -->
        <!-- include:layers/S/pages/layer-s.html -->
        <!-- include:layers/R/pages/registry.html -->
      </div>
      <div class="overview-footnote" data-page="overview"><span id="accessSummary">正在读取访问范围…</span><button class="text-button" data-view="access">管理访问范围 →</button></div>
      <footer class="page-footer"><span>QQ Bridge · 连接日常，保持自主</span><span id="lastUpdated">等待首次同步</span></footer>
    </main>
  </div>
      <div class="modal-overlay" id="slangModalOverlay">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="slangModalTitle" tabindex="-1">
        <h3 id="slangModalTitle">确认黑话</h3>
        <div class="meta" id="slangModalContent" style="margin-bottom:6px"></div>
        <label>含义 *</label>
        <input type="text" id="slangModalMeaning" placeholder="必须填写，确认后才会注入 AI 上下文">
        <label>用法（可选）</label>
        <input type="text" id="slangModalUsage" placeholder="使用场景 / 语气">
        <label>示例（可选）</label>
        <input type="text" id="slangModalExample" placeholder="自然短句示例">
        <label>风险/慎用说明（可选）</label>
        <input type="text" id="slangModalRisk" placeholder="敏感 / 慎用风险">
        <label>参考来源（可选，每行一个 URL）</label>
        <textarea id="slangModalSources" rows="3" placeholder="https://..."></textarea>
        <div class="row">
          <button id="slangModalDirectConfirm" class="small">直接确认（转正）</button>
          <button id="slangModalSendResearch" class="small">送 DSH 深度研究</button>
          <button id="slangModalCancel" class="small">取消</button>
        </div>
      </div>
    </div>


  <div class="toast" id="consoleToast" role="status" hidden></div>
  <noscript><div class="connection-alert">控制台需要启用 JavaScript 才能加载状态及保存设置。</div></noscript>


<script src="/console/app.js?v={{BUILD}}" defer></script>
</body>
</html>
